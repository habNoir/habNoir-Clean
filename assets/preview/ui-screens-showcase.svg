    <text x="61" y="527" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#F3EFEA">Kembali</text>
    <rect x="112" y="504" width="154" height="38" rx="19" fill="#F3EFEA"/>
    <text x="189" y="527" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#090A0F">Lanjut</text>
  </g>

  <!-- Screen 2: Tab Ruang (HomeScreen) -->
