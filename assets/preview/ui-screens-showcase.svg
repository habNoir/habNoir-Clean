    <rect width="286" height="564" rx="26" fill="#090A0F" stroke="#2B2F40" stroke-width="2"/>
    <!-- TopBar -->
    <rect x="18" y="20" width="24" height="24" rx="6" fill="#11131A"/>
    <text x="30" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#F3EFEA">hN</text>
    <text x="50" y="37" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#F3EFEA">habNoir Clean</text>
    <rect x="176" y="21" width="88" height="22" rx="11" fill="#11131A"/>
    <text x="220" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#9499A6">TECNO HiOS</text>
    <line x1="0" y1="54" x2="286" y2="54" stroke="#232634" stroke-width="1"/>

    <!-- Hero -->
    <text x="20" y="104" font-family="ui-monospace, Consolas, monospace" font-size="34" font-weight="700" fill="#F3EFEA">1.94 GB</text>
    <text x="20" y="126" font-family="system-ui, sans-serif" font-size="11.5" fill="#9499A6">Cache dari 14 aplikasi siap dibersihkan.</text>

    <!-- Strata Bar -->
    <rect x="20" y="142" width="246" height="9" rx="3" fill="#11131A"/>
    <rect x="20" y="142" width="142" height="9" rx="2" fill="#3E4459"/>
    <rect x="164" y="142" width="64" height="9" rx="2" fill="#F3EFEA"/>
    <rect x="230" y="142" width="32" height="9" rx="2" fill="#E2C499"/>
    <text x="20" y="166" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#9499A6">Pribadi 118G   Cache 1.48G   Sampah 460M</text>

    <!-- Primary CTA -->
    <rect x="20" y="182" width="246" height="42" rx="21" fill="#F3EFEA"/>
    <text x="143" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#090A0F">Bersihkan cache bertahap</text>
    <text x="20" y="242" font-family="system-ui, sans-serif" font-size="10.5" fill="#9499A6">Foto, chat, dan akun login tidak tersentuh.</text>
    <text x="266" y="242" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#636875">12 per jeda</text>
    <line x1="20" y1="256" x2="266" y2="256" stroke="#232634" stroke-width="1"/>

    <!-- App Ledger List -->
    <text x="20" y="278" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F3EFEA">Cache terbesar saat ini</text>
    <!-- Row 1 -->
    <rect x="20" y="294" width="34" height="34" rx="8" fill="#171A24"/>
    <text x="37" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">TT</text>
    <text x="64" y="309" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#F3EFEA">TikTok</text>
    <text x="64" y="326" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">612 MB</text>
    <!-- Row 2 -->
