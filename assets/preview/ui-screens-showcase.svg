    <text x="232" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Sampah</text>
  </g>

  <!-- Screen 3: Tab Aplikasi (AppsScreen) -->
  <g transform="translate(652, 28)">
    <rect width="286" height="564" rx="26" fill="#090A0F" stroke="#2B2F40" stroke-width="2"/>
    <rect x="18" y="20" width="24" height="24" rx="6" fill="#11131A"/>
    <text x="30" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#F3EFEA">hN</text>
    <text x="50" y="37" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#F3EFEA">habNoir Clean</text>
