    <rect x="22" y="514" width="64" height="24" rx="12" fill="#F3EFEA" opacity="0.14"/>
    <text x="54" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">Ruang</text>
