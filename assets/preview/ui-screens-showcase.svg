    <text x="20" y="84" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#F3EFEA">Aplikasi</text>
    <text x="20" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Ketuk ikon gembok untuk mengecualikan aplikasi.</text>

