    <text x="266" y="36" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#F3EFEA">Tutup</text>
    <!-- Progress Track -->
    <rect x="20" y="48" width="246" height="3" rx="1.5" fill="#171A24"/>
    <rect x="20" y="48" width="164" height="3" rx="1.5" fill="#E2C499"/>

    <!-- Animated Canvas Artwork Box -->
    <rect x="20" y="70" width="246" height="132" rx="14" fill="#11131A" stroke="#232634" stroke-width="1"/>
    <!-- Telemetry Bars -->
    <rect x="32" y="88" width="112" height="16" rx="4" fill="#E2C499" opacity="0.9"/>
    <rect x="32" y="114" width="84" height="16" rx="4" fill="#E2C499" opacity="0.85"/>
    <rect x="32" y="140" width="64" height="16" rx="4" fill="#E2C499" opacity="0.8"/>
    <line x1="115" y1="80" x2="115" y2="190" stroke="#E2C499" stroke-width="1.5"/>
    <!-- Mini Notification Card inside Canvas -->
    <rect x="160" y="84" width="94" height="104" rx="8" fill="#171A24" stroke="#E2C499" stroke-width="1"/>
    <circle cx="174" cy="100" r="4" fill="#E2C499"/>
    <rect x="184" y="96" width="58" height="7" rx="3" fill="#F3EFEA"/>
    <rect x="170" y="122" width="74" height="6" rx="3" fill="#090A0F"/>
    <rect x="170" y="122" width="52" height="6" rx="3" fill="#E2C499"/>
    <rect x="170" y="164" width="34" height="12" rx="3" fill="#2A2E3D"/>
    <rect x="210" y="164" width="34" height="12" rx="3" fill="#E2C499" opacity="0.45"/>

    <!-- Content -->
    <text x="20" y="232" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#F3EFEA">Izin membaca ukuran cache</text>
    <text x="20" y="254" font-family="system-ui, sans-serif" font-size="11.5" fill="#9499A6">Android mewajibkan izin Akses Penggunaan</text>
    <text x="20" y="270" font-family="system-ui, sans-serif" font-size="11.5" fill="#9499A6">agar aplikasi dapat menghitung total cache.</text>
    <rect x="20" y="286" width="246" height="36" rx="18" fill="#090A0F" stroke="#3A3F54" stroke-width="1"/>
    <text x="143" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F3EFEA">Siap</text>

    <line x1="20" y1="338" x2="266" y2="338" stroke="#232634" stroke-width="1"/>
    <text x="20" y="362" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F3EFEA">Izin notifikasi progres</text>
    <text x="20" y="382" font-family="system-ui, sans-serif" font-size="11.5" fill="#9499A6">Menampilkan status pembersihan bertahap</text>
    <text x="20" y="398" font-family="system-ui, sans-serif" font-size="11.5" fill="#9499A6">langsung lewat popup izin biasa.</text>
    <rect x="20" y="414" width="246" height="36" rx="18" fill="#090A0F" stroke="#E2C499" stroke-width="1"/>
    <text x="143" y="437" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F3EFEA">Izinkan notifikasi</text>

