<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="100%" height="100%">
  <!-- Background -->
  <rect width="1280" height="620" rx="20" fill="#090A0F" stroke="#232634" stroke-width="1.5"/>

  <!-- Screen 1: Wizard & Animated Artwork -->
