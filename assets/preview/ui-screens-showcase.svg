    <text x="53" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#090A0F">Semua</text>
    <rect x="94" y="164" width="96" height="28" rx="8" fill="#11131A" stroke="#232634" stroke-width="1"/>
    <text x="142" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Di atas 150 MB</text>
    <rect x="198" y="164" width="68" height="28" rx="8" fill="#11131A" stroke="#232634" stroke-width="1"/>
    <text x="232" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Dikecualikan</text>

    <line x1="20" y1="204" x2="266" y2="204" stroke="#232634" stroke-width="1"/>

    <!-- Ledger Rows -->
    <g transform="translate(0, 216)">
      <rect x="20" y="0" width="34" height="34" rx="8" fill="#171A24"/>
      <text x="37" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">TT</text>
      <text x="64" y="15" font-family="system-ui, sans-serif" font-size="13" fill="#F3EFEA">TikTok</text>
      <text x="64" y="32" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">612 MB</text>

      <rect x="20" y="54" width="34" height="34" rx="8" fill="#171A24"/>
      <text x="37" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">IG</text>
      <text x="64" y="69" font-family="system-ui, sans-serif" font-size="13" fill="#F3EFEA">Instagram</text>
      <text x="64" y="86" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">342 MB</text>

      <rect x="20" y="108" width="34" height="34" rx="8" fill="#171A24"/>
      <text x="37" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">YT</text>
      <text x="64" y="123" font-family="system-ui, sans-serif" font-size="13" fill="#F3EFEA">YouTube</text>
      <text x="64" y="140" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">265 MB</text>

      <rect x="20" y="162" width="34" height="34" rx="8" fill="#171A24"/>
      <text x="37" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">CH</text>
      <text x="64" y="177" font-family="system-ui, sans-serif" font-size="13" fill="#F3EFEA">Chrome</text>
      <text x="64" y="194" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">214 MB</text>

      <rect x="20" y="216" width="34" height="34" rx="8" fill="#171A24"/>
      <text x="37" y="237" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">SP</text>
      <text x="64" y="231" font-family="system-ui, sans-serif" font-size="13" fill="#F3EFEA">Shopee</text>
      <text x="64" y="248" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">178 MB</text>
    </g>

    <!-- Bottom NavigationBar -->
    <line x1="0" y1="504" x2="286" y2="504" stroke="#232634" stroke-width="1"/>
    <text x="54" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Ruang</text>
    <rect x="111" y="514" width="64" height="24" rx="12" fill="#F3EFEA" opacity="0.14"/>
    <text x="143" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">Aplikasi</text>
    <text x="232" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Sampah</text>
  </g>

  <!-- Screen 4: Tab Sampah 3 Lapis (TrashScreen) -->
  <g transform="translate(964, 28)">
    <rect width="286" height="564" rx="26" fill="#090A0F" stroke="#2B2F40" stroke-width="2"/>
    <rect x="18" y="20" width="24" height="24" rx="6" fill="#11131A"/>
    <text x="30" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#F3EFEA">hN</text>
    <text x="50" y="37" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#F3EFEA">habNoir Clean</text>
    <line x1="0" y1="54" x2="286" y2="54" stroke="#232634" stroke-width="1"/>

    <text x="20" y="84" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#F3EFEA">Folder sampah</text>
    <text x="20" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Foto dan video yang baru dihapus biasanya</text>
    <text x="20" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">masih tersimpan 30 hari sebelum hilang permanen.</text>

    <!-- Layer 1 -->
    <line x1="20" y1="132" x2="266" y2="132" stroke="#232634" stroke-width="1"/>
    <text x="20" y="154" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F3EFEA">1. Sampah galeri 30 hari</text>
    <text x="266" y="154" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#E2C499">42 berkas (310 MB)</text>
    <text x="20" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Menghapus permanen berkas MediaStore</text>
    <text x="20" y="188" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">secara bertahap per 150 berkas.</text>
    <rect x="20" y="200" width="210" height="36" rx="18" fill="#F3EFEA"/>
    <text x="125" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#090A0F">Kosongkan permanen (310 MB)</text>

    <!-- Layer 2 -->
    <line x1="20" y1="252" x2="266" y2="252" stroke="#232634" stroke-width="1"/>
    <text x="20" y="274" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F3EFEA">2. Folder sampah tersembunyi</text>
    <text x="266" y="274" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" fill="#636875">Opsional FOSS</text>
    <text x="20" y="294" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Memeriksa direktori sampah terverifikasi</text>
    <text x="20" y="308" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">(.Trash, .recycle, .trashed) dengan aman.</text>
    <rect x="20" y="320" width="236" height="36" rx="18" fill="#F3EFEA"/>
    <text x="138" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#090A0F">Hapus 18 berkas tersembunyi (150 MB)</text>

    <!-- Layer 3 -->
    <line x1="20" y1="372" x2="266" y2="372" stroke="#232634" stroke-width="1"/>
    <text x="20" y="394" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F3EFEA">3. Galeri bawaan HP</text>
    <text x="20" y="414" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Buka menu Baru dihapus di Galeri bawaan HP</text>
    <text x="20" y="428" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">untuk mengosongkan sampah terenkripsi pabrik.</text>
    <rect x="20" y="442" width="132" height="34" rx="17" fill="#090A0F" stroke="#3A3F54" stroke-width="1"/>
    <text x="86" y="463" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#F3EFEA">Galeri AI</text>

    <!-- Bottom NavigationBar -->
    <line x1="0" y1="504" x2="286" y2="504" stroke="#232634" stroke-width="1"/>
    <text x="54" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Ruang</text>
    <text x="143" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9499A6">Aplikasi</text>
    <rect x="200" y="514" width="64" height="24" rx="12" fill="#F3EFEA" opacity="0.14"/>
    <text x="232" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">Sampah</text>
  </g>
</svg>
