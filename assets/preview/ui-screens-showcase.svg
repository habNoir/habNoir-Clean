    <text x="37" y="367" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">IG</text>
    <text x="64" y="361" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#F3EFEA">Instagram</text>
    <text x="64" y="378" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">342 MB</text>
    <!-- Row 3 -->
    <rect x="20" y="398" width="34" height="34" rx="8" fill="#171A24"/>
    <text x="37" y="419" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">TG</text>
    <text x="64" y="413" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#F3EFEA">Telegram</text>
    <text x="64" y="430" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">284 MB</text>
    <!-- Row 4 (Whitelisted) -->
    <g opacity="0.62">
      <rect x="20" y="450" width="34" height="34" rx="8" fill="#171A24"/>
      <text x="37" y="471" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3EFEA">WA</text>
      <text x="64" y="465" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#F3EFEA">WhatsApp</text>
      <text x="64" y="482" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#9499A6">188 MB</text>
      <text x="116" y="482" font-family="system-ui, sans-serif" font-size="10.5" fill="#E2C499">Dikecualikan</text>
    </g>

